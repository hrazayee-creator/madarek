<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدارک من</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="theme-color" content="#0e9f8e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f7f7;--cd:#fff;--tx:#12262b;--mu:#62777c;--ac:#0e9f8e;--ac2:#0a7a6d;--bd:#dbe6e7;--dg:#d64545;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1f24;--cd:#12303a;--tx:#e8f3f3;--mu:#93aeb3;--bd:#1f4550;--ac:#22c1ae;--ac2:#18a392;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 16px 8px}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:20px;margin:0;flex:1}
input,select,textarea,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--cd)}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--cd);border:1px solid var(--bd)}
.pri{background:var(--ac2);color:#fff;border-color:transparent}
.dg{color:var(--dg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ac2);color:#fff;border-color:transparent}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:8px 16px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:14px;border-radius:18px;min-height:112px}
.ic{font-size:30px;line-height:1}.card small{color:var(--mu)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:48px 16px}
.fab{position:fixed;inset-inline-start:20px;bottom:max(20px,env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 8px 24px #0005}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--bg);color:var(--tx);box-shadow:0 20px 60px #0007}
dialog::backdrop{background:#000a}
.in{padding:18px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;gap:8px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.fld span{color:var(--mu);font-size:13px;min-width:84px}.fld b{flex:1;direction:ltr;text-align:start;word-break:break-all;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
.file{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:var(--cd);font-size:13px;text-align:center;padding:6px;word-break:break-all}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px}
.note{color:var(--mu);font-size:13px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111d;color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row"><h1>🗂️ مدارک من</h1><button id="inst" hidden class="pri">نصب</button><button id="lockb" title="قفل" hidden>🔒</button></div>
  <input id="q" type="search" placeholder="جستجو…" style="margin-top:8px">
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<button class="fab pri" id="add" aria-label="افزودن" hidden>＋</button>

<dialog id="dl"><div class="in"><h2 id="lt" style="margin:0"></h2><p class="note" id="ln"></p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="رمز عددی (حداقل ۴ رقم)">
  <p id="le" class="dg" style="margin:0"></p>
  <button class="pri" id="lgo">ادامه</button><button id="lskip" hidden>بدون قفل ادامه می‌دهم</button></div></dialog>

<dialog id="df"><form class="in" id="fm" method="dialog">
  <h2 style="margin:0">مدرک جدید</h2>
  <select id="fc"></select>
  <input id="ft" placeholder="عنوان (مثلاً پاسپورت من)" required>
  <div id="fr" style="display:flex;flex-direction:column;gap:6px"></div>
  <button type="button" id="fa">＋ افزودن کد / فیلد</button>
  <label class="note">عکس یا فایل (چندتایی، PDF و تصویر)</label>
  <input id="ff" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt">
  <div class="acts"><button class="pri" id="fs" type="submit">ذخیره</button><button type="button" id="fx">انصراف</button></div>
</form></dialog>

<dialog id="dv"><div class="in" id="vb"></div></dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={passport:['🛂','پاسپورت',['شماره پاسپورت','تاریخ انقضا']],id:['🪪','کارت شناسایی',['شماره کارت','تاریخ انقضا']],ins:['🏥','بیمه',['کد بیمه','شماره عضویت']],fida:['🔢','کد فیدا / اختصاصی',['کد فیدا']],cv:['📄','رزومه (CV)',[]],other:['🗂️','سایر',[]]};
const te=new TextEncoder(),td=new TextDecoder();
let db,key=null,cfg,items=[],cat='',urls=[];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};

/* IndexedDB */
const P=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const open=()=>P(Object.assign(indexedDB.open('madarek',1),{onupgradeneeded:e=>{e.target.result.createObjectStore('items',{keyPath:'id'});e.target.result.createObjectStore('meta')}}));
const st=(s,m='readonly')=>db.transaction(s,m).objectStore(s);

/* Crypto (AES-GCM + PBKDF2) */
async function derive(pin,salt){const m=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(buf){if(!key)return{iv:null,ct:buf};const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf)}}
const dec=o=>o.iv?crypto.subtle.decrypt({name:'AES-GCM',iv:o.iv},key,o.ct):Promise.resolve(o.ct);

/* Lock screen */
function lockUI(mode){
  const d=$('#dl');$('#le').textContent='';$('#pin').value='';
  $('#lt').textContent=mode==='setup'?'ساخت رمز':'ورود';
  $('#ln').textContent=mode==='setup'?'مدارک با این رمز روی گوشی رمزنگاری می‌شوند. رمز را فراموش کنی، قابل بازیابی نیست.':'رمز را وارد کن.';
  $('#lskip').hidden=mode!=='setup';
  $('#lgo').onclick=async()=>{
    const pin=$('#pin').value;if(pin.length<4){$('#le').textContent='حداقل ۴ رقم';return}
    try{
      if(mode==='setup'){const salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pin,salt);cfg={salt,check:await enc(te.encode('ok'))};await P(st('meta','readwrite').put(cfg,'cfg'))}
      else{key=await derive(pin,cfg.salt);if(td.decode(await dec(cfg.check))!=='ok')throw 0}
      d.close();start()
    }catch(e){key=null;$('#le').textContent='رمز اشتباه است'}
  };
  $('#lskip').onclick=async()=>{cfg={nolock:true};await P(st('meta','readwrite').put(cfg,'cfg'));d.close();start()};
  d.addEventListener('cancel',e=>e.preventDefault());d.showModal();
}

/* Data */
async function load(){
  const rows=await P(st('items').getAll());items=[];
  for(const r of rows){try{items.push({...r,m:JSON.parse(td.decode(await dec(r.m)))})}catch(e){}}
  items.sort((a,b)=>b.ts-a.ts);render();
}
function render(){
  $('#chips').innerHTML=[['','همه'],...Object.entries(CATS).map(([k,v])=>[k,v[0]+' '+v[1]])].map(([k,l])=>`<button class="chip ${cat===k?'on':''}" data-c="${k}">${l}</button>`).join('');
  const q=$('#q').value.trim();
  const rows=items.filter(i=>(!cat||i.cat===cat)&&(!q||(i.m.title+i.m.fields.map(f=>f.k+f.v).join(' ')).includes(q)));
  $('#list').innerHTML=rows.length?rows.map(i=>`<button class="card" data-id="${i.id}"><span class="ic">${CATS[i.cat][0]}</span><b>${esc(i.m.title)}</b><small>${CATS[i.cat][1]} · ${i.files.length} فایل</small></button>`).join(''):'<p class="empty">هنوز مدرکی نیست.<br>با دکمهٔ ＋ اولین مدرکت را اضافه کن.</p>';
}
$('#chips').onclick=e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render()}};
$('#q').oninput=render;
$('#list').onclick=e=>{const c=e.target.closest('[data-id]');if(c)view(c.dataset.id)};

/* Add form */
const frow=(k='',v='')=>{const r=document.createElement('div');r.className='kv';r.innerHTML=`<input placeholder="نام (مثلاً کد بیمه)" value="${esc(k)}"><input dir="ltr" placeholder="مقدار" value="${esc(v)}"><button type="button" class="dg">✕</button>`;r.lastChild.onclick=()=>r.remove();$('#fr').append(r)};
function preset(){$('#fr').innerHTML='';CATS[$('#fc').value][2].forEach(k=>frow(k))}
$('#fc').innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('');
$('#fc').onchange=preset;$('#fa').onclick=()=>frow();
$('#add').onclick=()=>{$('#fm').reset();preset();$('#df').showModal()};
$('#fx').onclick=()=>$('#df').close();
async function shrink(f){
  if(!f.type.startsWith('image/')||f.type==='image/gif')return f;
  try{const b=await createImageBitmap(f),s=Math.min(1,2000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    const o=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));return new File([o],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){return f}
}
$('#fm').onsubmit=async e=>{
  e.preventDefault();$('#fs').disabled=true;
  try{
    const fields=[...$('#fr').children].map(r=>({k:r.children[0].value.trim(),v:r.children[1].value.trim()})).filter(f=>f.v);
    const files=[];for(const f of $('#ff').files){const g=await shrink(f);files.push({name:g.name,type:g.type||'application/octet-stream',...await enc(await g.arrayBuffer())})}
    const rec={id:crypto.randomUUID(),cat:$('#fc').value,ts:Date.now(),m:await enc(te.encode(JSON.stringify({title:$('#ft').value.trim(),fields}))),files};
    await P(st('items','readwrite').put(rec));$('#df').close();await load();toast('ذخیره شد ✓')
  }catch(err){toast('خطا در ذخیره')}finally{$('#fs').disabled=false}
};

/* View / share */
const textOf=i=>i.m.title+'\n'+i.m.fields.map(f=>`${f.k}: ${f.v}`).join('\n');
async function filesOf(i){return Promise.all(i.files.map(async f=>new File([await dec(f)],f.name,{type:f.type})))}
async function view(id){
  const i=items.find(x=>x.id===id);urls.forEach(URL.revokeObjectURL);urls=[];
  const fs=await filesOf(i);
  const th=fs.map((f,n)=>{if(f.type.startsWith('image/')){const u=URL.createObjectURL(f);urls.push(u);return`<img src="${u}" data-n="${n}" alt="">`}return`<div class="file" data-n="${n}">📎 ${esc(f.name)}</div>`}).join('');
  $('#vb').innerHTML=`<div class="row"><h2 style="margin:0;flex:1">${CATS[i.cat][0]} ${esc(i.m.title)}</h2><button id="vx">✕</button></div>
  ${i.m.fields.map((f,n)=>`<div class="fld"><span>${esc(f.k)}</span><b>${esc(f.v)}</b><button data-cp="${n}">کپی</button></div>`).join('')}
  ${th?`<div class="thumbs">${th}</div><p class="note">برای ذخیرهٔ هر فایل رویش بزن.</p>`:''}
  <div class="acts"><button class="pri" id="vs">📤 ارسال (پیام‌رسان‌ها)</button><button id="vm">✉️ ایمیل</button><button id="vt">📋 کپی همهٔ کدها</button><button id="vd" class="dg">🗑 حذف</button></div>
  <p class="note">ارسال، منوی گوشی را باز می‌کند (تلگرام، واتساپ، پیامک، Gmail …) و فایل‌ها پیوست می‌شوند. ایمیل فقط متن کدها را می‌فرستد؛ برای پیوست فایل از «ارسال» و انتخاب برنامهٔ ایمیل استفاده کن.</p>`;
  $('#vx').onclick=()=>$('#dv').close();
  $('#vb').onclick=async e=>{
    const cp=e.target.closest('[data-cp]');if(cp){await navigator.clipboard.writeText(i.m.fields[cp.dataset.cp].v);toast('کپی شد ✓')}
    const t=e.target.closest('[data-n]');if(t){const f=fs[t.dataset.n],a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
  };
  $('#vt').onclick=async()=>{await navigator.clipboard.writeText(textOf(i));toast('کپی شد ✓')};
  $('#vm').onclick=()=>{location.href=`mailto:?subject=${encodeURIComponent(i.m.title)}&body=${encodeURIComponent(textOf(i))}`};
  $('#vs').onclick=async()=>{
    try{
      if(fs.length&&navigator.canShare?.({files:fs}))await navigator.share({title:i.m.title,text:textOf(i),files:fs});
      else if(navigator.share)await navigator.share({title:i.m.title,text:textOf(i)});
      else{await navigator.clipboard.writeText(textOf(i));toast('اشتراک‌گذاری پشتیبانی نمی‌شود؛ متن کپی شد')}
    }catch(e){}
  };
  $('#vd').onclick=async()=>{if(confirm('این مدرک برای همیشه حذف شود؟')){await P(st('items','readwrite').delete(id));$('#dv').close();load()}};
  $('#dv').showModal();
}
$('#dv').onclose=()=>{urls.forEach(URL.revokeObjectURL);urls=[]};

/* Start / PWA */
function start(){$('#add').hidden=false;$('#lockb').hidden=!!cfg.nolock;load();
  document.addEventListener('visibilitychange',()=>{if(cfg.nolock)return;if(document.hidden)sessionStorage.h=Date.now();else if(Date.now()-(+sessionStorage.h||Date.now())>120000)location.reload()})}
$('#lockb').onclick=()=>location.reload();
let ev;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{ev.prompt();await ev.userChoice;$('#inst').hidden=true};
(async()=>{
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.storage?.persist?.();
  db=await open();cfg=await P(st('meta').get('cfg'));
  if(!cfg)lockUI('setup');else if(cfg.nolock)start();else lockUI('unlock');
})();
</script>
</body>
</html>
